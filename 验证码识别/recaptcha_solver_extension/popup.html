<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; margin: 0; padding: 12px; font-family: "Microsoft YaHei", sans-serif; font-size: 13px; color: #222; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; gap: 8px; }
    button { padding: 6px 12px; border: 0; border-radius: 4px; cursor: pointer; font-size: 13px; }
    #solveBtn { background: #1a73e8; color: #fff; width: 100%; }
    #solveBtn:disabled { background: #aaa; }
    input[type=text] { flex: 1; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; }
    #status { margin-top: 8px; font-size: 12px; color: #666; word-break: break-all; min-height: 14px; }
    .ok { color: #188038; }
    .err { color: #d93025; }
  </style>
</head>
<body>
  <h1>reCAPTCHA VLM Solver</h1>
  <div class="row">
    <label>服务地址</label>
    <input type="text" id="serverUrl" placeholder="http://127.0.0.1:8765" />
  </div>
  <div class="row">
    <label><input type="checkbox" id="autoSolve" /> 自动模式</label>
    <button id="pingBtn">探测服务</button>
  </div>
  <div class="row">
    <button id="solveBtn">立即求解当前挑战</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
